# Persistent virtual sink for musicbot.
# Install: cp this file to ~/.config/pipewire/pipewire.conf.d/
# Then:    systemctl --user restart pipewire pipewire-pulse
# Verify:  pactl list short sinks | grep BotSink
context.objects = [
    {   factory = adapter
        args = {
            factory.name        = support.null-audio-sink
            node.name           = "BotSink"
            node.description    = "BotSink (musicbot bridge)"
            media.class         = Audio/Sink
            object.linger       = true
            audio.position      = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
]

[project]
name = "musicbot"
version = "0.1.0"
description = "Discord bot that bridges a local PipeWire/PulseAudio sink monitor into a voice channel."
requires-python = ">=3.11"
dependencies = [
    "adb-shell>=0.4",
    "discord.py[voice]>=2.4",
    "python-dotenv>=1.0",
    "rsa>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicbot"]
